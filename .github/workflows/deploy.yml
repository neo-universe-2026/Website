name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Get wasm-bindgen version from Cargo.lock
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' wasm/Cargo.lock | awk '/^version/ {print $3; exit}' | tr -d '"')
          if [ -z "$version" ]; then
            echo "could not find wasm-bindgen version in wasm/Cargo.lock" >&2
            exit 1
          fi
          echo "WASM_BINDGEN_VERSION=$version" >> "$GITHUB_ENV"
          echo "wasm-bindgen $version"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      - name: Build sonificator WASM
        run: |
          cargo build --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown --release
          mkdir -p wasm/pkg
          wasm-bindgen wasm/target/wasm32-unknown-unknown/release/sonificator_wasm.wasm \
            --target web --out-dir wasm/pkg --out-name sonificator_wasm

      # Free the preinstalled SDKs we don't need; the fetch step downloads
      # multi-hundred-MB NASA originals and 4K transcodes otherwise hit
      # ENOSPC mid-download (curl exit 23).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # The hosted runner image has no ffmpeg; scripts/fetch-videos.sh
      # needs it for the transcode step.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Cache the transcoded videos, not the 1.9 GB of NASA originals:
      # scripts/fetch-videos.sh skips any track whose videos/<id>.mp4
      # already exists, so a restored cache avoids all downloads. The key
      # includes the fetch script's hash so transcoding changes (or new
      # datasets) invalidate it.
      - name: Restore dataset video cache
        uses: actions/cache/restore@v4
        with:
          path: videos
          key: svs-videos-v2-${{ hashFiles('scripts/fetch-videos.sh') }}
          restore-keys: svs-videos-v2-

      - name: Fetch and transcode dataset videos
        run: |
          bash scripts/fetch-videos.sh
          df -h /

      - name: Save dataset video cache
        if: always()
        continue-on-error: true   # save fails softly when the key already exists
        uses: actions/cache/save@v4
        with:
          path: videos
          key: svs-videos-v2-${{ hashFiles('scripts/fetch-videos.sh') }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Only the site itself may be uploaded: cargo build artifacts and the
      # video source cache are too large for the 1 GB Pages artefact limit,
      # and the generated videos/*.mp4 stay.
      - name: Strip build artifacts from upload
        run: rm -rf .cache wasm/target sonificator

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
